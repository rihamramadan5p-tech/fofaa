
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffe1ed, #f8c4dc, #e8d8ff);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
}

.container {
    width: 100%;
    padding: 15px;
    position: relative;
    z-index: 2;
}

h1 {
    color: #b83270;
    font-size: 35px;
}

p {
    color: #914267;
    font-size: 18px;
}

/* Cake */

.cake {
    position: relative;
    width: 280px;
    height: 250px;
    margin: 65px auto 15px;
}

.layer {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 15px 15px 12px 12px;
    box-shadow: 0 6px 8px #b94e7955;
    border-bottom: 8px solid #dc729c;
    overflow: hidden;
}

.layer1 {
    width: 260px;
    height: 75px;
    bottom: 0;
    background: #ff9fc5;
}

.layer2 {
    width: 205px;
    height: 68px;
    bottom: 75px;
    background: #ffc0d9;
}

.layer3 {
    width: 145px;
    height: 65px;
    bottom: 143px;
    background: #ffe3ed;
}

/* Cream */

.icing {
    position: absolute;
    height: 17px;
    background: #fff8fb;
    top: 0;
    left: 0;
    width: 100%;
    border-radius: 12px 12px 50% 50%;
    z-index: 2;
}

.icing::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 12px;
    background: #fff8fb;
    left: 20px;
    top: 7px;
    border-radius: 0 0 10px 10px;
    box-shadow:
        35px 3px 0 #fff8fb,
        70px 0 0 #fff8fb,
        105px 3px 0 #fff8fb,
        140px 0 0 #fff8fb,
        175px 3px 0 #fff8fb,
        210px 0 0 #fff8fb;
}

/* Decorations */

.sprinkles {
    position: absolute;
    z-index: 3;
    font-size: 12px;
    letter-spacing: 3px;
    white-space: nowrap;
}

.s1 {
    top: 27px;
    left: 12px;
}

.s2 {
    top: 27px;
    right: 12px;
}

.decor {
    position: absolute;
    z-index: 4;
    font-size: 19px;
}

.d1 {
    bottom: 12px;
    left: 35px;
}

.d2 {
    bottom: 12px;
    right: 35px;
}

.d3 {
    bottom: 12px;
    left: 28px;
}

.d4 {
    bottom: 12px;
    right: 28px;
}

.d5 {
    bottom: 12px;
    left: 25px;
}

.d6 {
    bottom: 12px;
    right: 25px;
}

/* Candles */

.candle {
    position: absolute;
    width: 12px;
    height: 48px;
    bottom: 195px;
    background: repeating-linear-gradient(
        45deg,
        white 0px,
        white 5px,
        #ff70a8 5px,
        #ff70a8 10px
    );
    border-radius: 5px;
    z-index: 6;
}

.c1 {
    left: 105px;
}

.c2 {
    left: 135px;
}

.c3 {
    left: 165px;
}

.flame {
    position: absolute;
    width: 15px;
    height: 22px;
    background: #ffb52e;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    top: -24px;
    left: -2px;
    box-shadow: 0 0 15px #ff9d00;
    animation: flicker .5s infinite alternate;
}

@keyframes flicker {
    from {
        transform: rotate(-45deg) scale(1);
    }

    to {
        transform: rotate(-40deg) scale(1.15);
    }
}

/* Button */

button {
    border: none;
    background: #d94685;
    color: white;
    padding: 15px 30px;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 5px 15px #b8327055;
    transition: .3s;
}

button:hover {
    background: #b83270;
    transform: scale(1.05);
}

/* Birthday Message */

#message {
    display: none;
    color: #a52c67;
    font-size: 22px;
    font-weight: bold;
    margin-top: 25px;
    line-height: 1.8;
    animation: appear 1s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Confetti */

.confetti {
    position: fixed;
    width: 10px;
    height: 16px;
    z-index: 10;
    pointer-events: none;
    animation: explode var(--duration) ease-out forwards;
}

@keyframes explode {
    0% {
        transform: translate(0, 0) rotate(0deg) scale(1);
        opacity: 1;
    }

    100% {
        transform: translate(var(--dx), var(--dy))
                   rotate(var(--rotation)) scale(.7);
        opacity: 0;
    }
}

/* Floating Hearts */

.heart {
    position: fixed;
    bottom: -30px;
    animation: float 4s linear forwards;
    pointer-events: none;
    z-index: 9;
}

@keyframes float {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

</style>
</head>

<body>

<div class="container">

    <h1>🎀 Happy Birthday 🎀</h1>

    <p>النهارده يوم مميز عشان الملكة  ❤️</p>

    <div class="cake">

        <!-- Candles -->

        <div class="candle c1">
            <div class="flame"></div>
        </div>

        <div class="candle c2">
            <div class="flame"></div>
        </div>

        <div class="candle c3">
            <div class="flame"></div>
        </div>

        <!-- Top Layer -->

        <div class="layer layer3">

            <div class="icing"></div>

            <span class="sprinkles s1">✨ • ✨</span>
            <span class="sprinkles s2">• ✨ •</span>

            <span class="decor d5">🍓</span>
            <span class="decor d6">💕</span>

        </div>

        <!-- Middle Layer -->

        <div class="layer layer2">

            <div class="icing"></div>

            <span class="sprinkles s1">• ✨ •</span>
            <span class="sprinkles s2">✨ • ✨</span>

            <span class="decor d3">🌸</span>
            <span class="decor d4">🍓</span>

        </div>

        <!-- Bottom Layer -->

        <div class="layer layer1">

            <div class="icing"></div>

            <span class="sprinkles s1">✨ • ✨</span>
            <span class="sprinkles s2">• ✨ •</span>

            <span class="decor d1">🍓</span>
            <span class="decor d2">🌸</span>

        </div>

    </div>

    <p>خدي نفس وتمني أمنية واطفى الشموع 🥹</p>

    <button onclick="celebrate()">
        ✨ اطفي الشموع ✨
    </button>

    <div id="message">

     كل سنة وانتي يا فوفة    ❤️

        <br>

        ربنا يفرح قلبك ويحققلك كل اللي بتتمنيه 🎂

        <br>

        بحبك يا أحلى أخت في الدنيا 💗

    </div>

</div>

<script>

function celebrate() {

    // إطفاء الشموع

    document.querySelectorAll(".flame").forEach(flame => {
        flame.style.display = "none";
    });

    // إظهار رسالة عيد الميلاد

    document.getElementById("message").style.display = "block";

    document.querySelector("button").style.display = "none";

    // ألوان قصاصات الورق

    const colors = [
        "#ff4081",
        "#ffca28",
        "#7c4dff",
        "#00c9a7",
        "#ff7043",
        "#ffffff",
        "#e91e63",
        "#40c4ff",
        "#ab47bc"
    ];

    // انفجار قصاصات الورق

    for (let i = 0; i < 180; i++) {

        let confetti = document.createElement("div");

        confetti.className = "confetti";

        confetti.style.background =
            colors[Math.floor(Math.random() * colors.length)];

        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.top = Math.random() * 100 + "vh";

        confetti.style.setProperty(
            "--dx",
            (Math.random() - 0.5) * 900 + "px"
        );

        confetti.style.setProperty(
            "--dy",
            (Math.random() - 0.5) * 900 + "px"
        );

        confetti.style.setProperty(
            "--rotation",
            Math.random() * 1000 + "deg"
        );

        confetti.style.setProperty(
            "--duration",
            (2 + Math.random() * 3) + "s"
        );

        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 5500);

    }

    // قلوب ونجوم طائرة

    for (let i = 0; i < 40; i++) {

        let heart = document.createElement("div");

        heart.className = "heart";

        heart.innerHTML = ["❤️", "💗", "✨", "🎀", "💕"][
            Math.floor(Math.random() * 5)
        ];

        heart.style.left = Math.random() * 100 + "vw";

        heart.style.fontSize =
            (20 + Math.random() * 25) + "px";

        heart.style.animationDuration =
            (3 + Math.random() * 3) + "s";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);

    }

}

</script>

</body>
</html>
